service: phone-verify-api

frameworkVersion: '3'
useDotenv: true
provider:
  name: aws
  runtime: nodejs18.x
  region: ap-south-1
  stage: ${opt:stage, 'dev'}

  memorySize: 512
  timeout: 29

  environment:
    NODE_ENV: production

    MONGODB_URI: ${env:MONGODB_URI}

    JWT_SECRET: ${env:JWT_SECRET}
    JWT_EXPIRES_IN: ${env:JWT_EXPIRES_IN}

    TWILIO_ACCOUNT_SID: ${env:TWILIO_ACCOUNT_SID}
    TWILIO_AUTH_TOKEN: ${env:TWILIO_AUTH_TOKEN}
    TWILIO_PHONE_NUMBER: ${env:TWILIO_PHONE_NUMBER}

    OTP_EXPIRY_MINUTES: ${env:OTP_EXPIRY_MINUTES}
    OTP_LENGTH: ${env:OTP_LENGTH}

    FRONTEND_URL: ${env:FRONTEND_URL}
  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:4200
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Requested-With
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowCredentials: true
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"

functions:
  api:
    handler: lambda.handler

    events:
      - httpApi:
          path: /
          method: ANY

      - httpApi:
          path: /{proxy+}
          method: ANY

package:
  individually: false

  patterns:
    - '!logs/**'
    - '!coverage/**'
    - '!test/**'
    - '!.git/**'
    - '!.env'
    - '!README.md'

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3000